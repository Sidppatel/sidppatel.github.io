# Zero-warning Pages workflow - every action runs on Node.js 24
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Inline the tar step so we can use the Node-24 uploader directly,
      # bypassing upload-pages-artifact (which still wraps a Node-20 uploader).
      - name: Build Pages artifact tarball
        run: |
          tar --dereference --hard-dereference \
              --exclude=.git --exclude=.github \
              --exclude=publish.ps1 --exclude=upgrade-pages.ps1 \
              -cf "$RUNNER_TEMP/artifact.tar" \
              --directory=. .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
